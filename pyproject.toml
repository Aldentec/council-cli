[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "council"
version = "0.1.0"
description = "CLI-first multi-agent conversation orchestrator for live advisory meetings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Council Contributors" }]
dependencies = [
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "Jinja2>=3.1.4",
  "markdown>=3.6",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0.1",
  "questionary>=2.0.1",
  "rich>=13.7.1",
  "typer>=0.12.3",
  "uvicorn>=0.30.1"
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=8.2.0"]

[project.scripts]
council = "council.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
council = ["ui/*.html", "ui/*.css", "templates/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
